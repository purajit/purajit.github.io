{% extends "base.html" %}
{% block content %}
<div class="page-content flex-col gappy-2x">
    {% for thought_group in data["thought_groups"] %}
    <div class="writing-title">{{ romanize(loop.length - loop.index + 1) }}</div>
    <div class="flex-col gappy">
    {% for thought in thought_group %}
    <div>{{ thought }}</div>
    {% endfor %}
    </div>
    {% endfor %}
</div>
{% endblock %}
