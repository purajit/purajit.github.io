<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Baby Mode</title>
    <style>
      :root {
        --bg: #0b0e11;
        --fg: #f8fafc;
        --muted: #a3b1c6;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          "Helvetica Neue",
          Arial;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        cursor: none;
      }
      .tabs {
        position: fixed;
        left: 12px;
        bottom: 12px;
        z-index: 2;
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        max-width: calc(100vw - 24px);
        padding: 6px;
        color: #cbd5e1;
        font-size: 13px;
        background: rgba(0, 0, 0, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        backdrop-filter: blur(8px);
        pointer-events: none;
      }
      .tab {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border-radius: 8px;
        opacity: 0.65;
        white-space: nowrap;
      }
      .tab .num {
        font-weight: 700;
        opacity: 0.55;
      }
      .tab.active {
        background: rgba(255, 255, 255, 0.18);
        color: #fff;
        opacity: 1;
        font-weight: 700;
      }
      .hidden {
        display: none;
      }
      .exitHotspot {
        position: fixed;
        top: 0;
        left: 0;
        width: 80px;
        height: 80px;
        z-index: 4;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>

    <div
      class="exitHotspot"
      id="exitHotspot"
      title="Triple‑click to exit"
    ></div>
    <div id="tabs" class="tabs hidden"></div>

    <script>
      (() => {
        const canvas = document.getElementById("c");
        const ctx = canvas.getContext("2d", { alpha: false });
        let W = 0,
          H = 0,
          DPR = 1;
        const tabsEl = document.getElementById("tabs");
        const exitHotspot = document.getElementById("exitHotspot");

        // Settings
        const settings = {
          muted: false,
          reduceMotion: false,
          paletteIndex: 0,
        };

        const palettes = [
          // pastels & softs
          ["#ffd6e8", "#ffecb3", "#c8f7dc", "#d6e4ff", "#f1d1ff", "#ffe5cc"],
          ["#ffd1a4", "#ffa6c1", "#a9def9", "#e4c1f9", "#caffbf"],
          ["#ffc8dd", "#ffafcc", "#bde0fe", "#a2d2ff"],
          ["#ffadad", "#ffd6a5", "#fdffb6", "#caffbf"],
          ["#f6bd60", "#f7ede2", "#84a59d", "#f28482", "#f5cac3"],
          ["#e2ece9", "#bee1e6", "#cddafd", "#f0efeb", "#dfe7fd"],
          // bright & playful
          ["#9b5de5", "#f15bb5", "#fee440", "#00bbf9", "#00f5d4"],
          ["#ff6b6b", "#ffd93d", "#6bcb77", "#4d96ff"],
          ["#ffbe0b", "#fb5607", "#ff006e", "#8338ec"],
          ["#ff9e00", "#ff6d00", "#ff3d00", "#c2185b"],
          ["#f72585", "#b5179e", "#7209b7", "#4361ee"],
          ["#39ff14", "#ff073a", "#00e5ff", "#ffea00"],
          ["#ff5d8f", "#ffca3a", "#8ac926", "#1982c4", "#6a4c93"],
          // nature
          ["#2d6a4f", "#40916c", "#74c69d", "#b7e4c7"],
          ["#606c38", "#588157", "#dda15e", "#bc6c25", "#fefae0"],
          ["#06d6a0", "#1b9aaa", "#a0e8af", "#f4f1bb"],
          ["#80b918", "#aacc00", "#bfd200", "#d4edda"],
          ["#a7c957", "#f2e8cf", "#bc4749", "#6a994e"],
          // water & sky
          ["#0077b6", "#00b4d8", "#90e0ef", "#caf0f8"],
          ["#0466c8", "#00b4d8", "#90e0ef", "#caf0f8"],
          ["#023e8a", "#0096c7", "#48cae4", "#ade8f4"],
          // sunset & fire
          ["#ffba08", "#f48c06", "#dc2f02", "#9d0208"],
          ["#ffd60a", "#ffc300", "#ff9505", "#e85d04"],
          ["#f4a261", "#e76f51", "#2a9d8f", "#e9c46a"],
          // purple & galaxy
          ["#3c096c", "#7b2cbf", "#c77dff", "#e0aaff"],
          ["#5a189a", "#7b2cbf", "#9d4edd", "#c77dff"],
          ["#9d4edd", "#c77dff", "#ff6ec7", "#ffb3f0"],
        ];

        const rand = (a = 1, b = 0) => Math.random() * (a - b) + b;
        const randi = (a, b = 0) => Math.floor(rand(a + 1, b));

        function resize() {
          DPR = Math.min(2, devicePixelRatio || 1);
          W = canvas.width = Math.round(innerWidth * DPR);
          H = canvas.height = Math.round(innerHeight * DPR);
          canvas.style.width = innerWidth + "px";
          canvas.style.height = innerHeight + "px";
        }
        addEventListener("resize", resize);
        resize();

        // ---------- Audio ----------
        let AC, masterGain;
        function initAudio() {
          if (AC) return;
          try {
            AC = new (window.AudioContext || window.webkitAudioContext)();
            masterGain = AC.createGain();
            masterGain.gain.value = settings.muted ? 0 : 0.15;
            // Soft limiter so a flurry of keypresses never gets harsh.
            const comp = AC.createDynamicsCompressor();
            comp.threshold.value = -14;
            comp.ratio.value = 12;
            masterGain.connect(comp).connect(AC.destination);
          } catch {}
        }

        // Generic synth voice. `slideTo` bends the pitch, `delay` offsets start.
        function tone(o = {}) {
          if (!AC || settings.muted) return;
          const {
            freq = 440,
            slideTo = null,
            type = "sine",
            dur = 0.3,
            vol = 0.4,
            attack = 0.008,
            delay = 0,
          } = o;
          const t0 = AC.currentTime + delay;
          const osc = AC.createOscillator();
          const g = AC.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, t0);
          if (slideTo)
            osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
          g.gain.setValueAtTime(0.0001, t0);
          g.gain.linearRampToValueAtTime(vol, t0 + attack);
          g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
          osc.connect(g).connect(masterGain);
          osc.start(t0);
          osc.stop(t0 + dur + 0.05);
        }

        // Filtered noise burst, good for bangs and splashes.
        function noiseBurst(o = {}) {
          if (!AC || settings.muted) return;
          const { dur = 0.4, vol = 0.3, from = 6000, to = 300, delay = 0 } = o;
          const t0 = AC.currentTime + delay;
          const len = Math.max(1, Math.floor(AC.sampleRate * dur));
          const buf = AC.createBuffer(1, len, AC.sampleRate);
          const data = buf.getChannelData(0);
          for (let i = 0; i < len; i++)
            data[i] = (Math.random() * 2 - 1) * (1 - i / len);
          const src = AC.createBufferSource();
          src.buffer = buf;
          const filter = AC.createBiquadFilter();
          filter.type = "lowpass";
          filter.frequency.setValueAtTime(from, t0);
          filter.frequency.exponentialRampToValueAtTime(to, t0 + dur);
          const g = AC.createGain();
          g.gain.setValueAtTime(vol, t0);
          g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
          src.connect(filter).connect(g).connect(masterGain);
          src.start(t0);
          src.stop(t0 + dur + 0.05);
        }

        // A little bell/chime used by the kaleidoscope.
        function bell(semitone = 0) {
          const base = 392 * Math.pow(2, semitone / 12);
          tone({ freq: base, type: "triangle", dur: 0.9, vol: 0.22 });
          tone({
            freq: base * 1.5,
            type: "sine",
            dur: 0.7,
            vol: 0.11,
            delay: 0.05,
          });
          tone({ freq: base * 2, type: "sine", dur: 0.45, vol: 0.07, delay: 0.1 });
        }

        // A watery "plop" for the ripples: a fast downward pitch bend with a
        // short wet tick on top.
        function plop() {
          if (!AC || settings.muted) return;
          const t0 = AC.currentTime;
          const osc = AC.createOscillator();
          const g = AC.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(560, t0);
          osc.frequency.exponentialRampToValueAtTime(90, t0 + 0.14);
          g.gain.setValueAtTime(0.0001, t0);
          g.gain.linearRampToValueAtTime(0.55, t0 + 0.006);
          g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);
          osc.connect(g).connect(masterGain);
          osc.start(t0);
          osc.stop(t0 + 0.28);
          noiseBurst({ dur: 0.05, vol: 0.1, from: 2200, to: 500 });
        }

        function plink() {
          tone({ freq: 220 * Math.pow(2, rand(0, 2)), dur: 0.35, vol: 0.5 });
        }

        // ---------- Effects Engine ----------
        let t = 0,
          effectIdx = 0;
        const effects = [];

        // Utility draw helpers
        function clear(bg) {
          ctx.fillStyle = bg;
          ctx.fillRect(0, 0, W, H);
        }
        function pick(arr) {
          return arr[randi(arr.length - 1)];
        }
        function palette() {
          return palettes[settings.paletteIndex % palettes.length];
        }

        // Device-pixel position of a pointer event (falls back to random).
        function pointerPos(e) {
          if (!e || e.clientX == null) return [rand(W), rand(H)];
          const rect =
            canvas.getBoundingClientRect?.() || { left: 0, top: 0 };
          return [(e.clientX - rect.left) * DPR, (e.clientY - rect.top) * DPR];
        }

        function drawPoly(x, y, r, sides, rot, color) {
          ctx.beginPath();
          for (let i = 0; i < sides; i++) {
            const a = rot + (i / sides) * Math.PI * 2;
            const px = x + Math.cos(a) * r;
            const py = y + Math.sin(a) * r;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.closePath();
          ctx.fillStyle = color;
          ctx.fill();
        }

        // ---------- Delaunay triangulation helpers ----------
        // True when p lies inside the circumcircle of triangle a,b,c.
        function inCircumcircle(a, b, c, p) {
          const ax = a[0] - p[0],
            ay = a[1] - p[1];
          const bx = b[0] - p[0],
            by = b[1] - p[1];
          const cx = c[0] - p[0],
            cy = c[1] - p[1];
          const det =
            (ax * ax + ay * ay) * (bx * cy - by * cx) -
            (bx * bx + by * by) * (ax * cy - ay * cx) +
            (cx * cx + cy * cy) * (ax * by - ay * bx);
          // Flip the sign so it works for either triangle winding.
          const orient =
            (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0]);
          return orient > 0 ? det > 0 : det < 0;
        }

        // Bowyer-Watson Delaunay triangulation. Returns triangles as index
        // triples into the returned `points` array.
        function delaunay(points) {
          // Work in a normalized [0,1] box. This keeps the far-away
          // super-triangle vertices from wrecking the floating point tests
          // for very wide/tall screens.
          let minX = Infinity,
            minY = Infinity,
            maxX = -Infinity,
            maxY = -Infinity;
          for (const p of points) {
            if (p[0] < minX) minX = p[0];
            if (p[0] > maxX) maxX = p[0];
            if (p[1] < minY) minY = p[1];
            if (p[1] > maxY) maxY = p[1];
          }
          const spanX = maxX - minX || 1,
            spanY = maxY - minY || 1;
          const pts = points.map((p) => [
            (p[0] - minX) / spanX,
            (p[1] - minY) / spanY,
          ]);
          // The super-triangle must be far larger than any circumcircle of
          // the input points, otherwise it leaves holes near the boundary.
          const s = 100000;
          const base = pts.length;
          pts.push([0.5 - s, 0.5 - s], [0.5 + s, 0.5 - s], [0.5, 0.5 + s]);

          let tris = [[base, base + 1, base + 2]];
          const hasEdge = (tri, u, v) =>
            (tri[0] === u || tri[1] === u || tri[2] === u) &&
            (tri[0] === v || tri[1] === v || tri[2] === v);

          for (let pi = 0; pi < points.length; pi++) {
            const p = pts[pi];
            const bad = [];
            for (let i = 0; i < tris.length; i++) {
              const [a, b, c] = tris[i];
              if (inCircumcircle(pts[a], pts[b], pts[c], p)) bad.push(i);
            }
            if (!bad.length) continue;
            // Edges that bound the polygonal hole left by the bad triangles.
            const edges = [];
            for (const i of bad) {
              const tri = tris[i];
              for (let e = 0; e < 3; e++) {
                const u = tri[e],
                  v = tri[(e + 1) % 3];
                let shared = false;
                for (const j of bad) {
                  if (j !== i && hasEdge(tris[j], u, v)) {
                    shared = true;
                    break;
                  }
                }
                if (!shared) edges.push([u, v]);
              }
            }
            bad.sort((x, y) => y - x);
            for (const i of bad) tris.splice(i, 1);
            for (const [u, v] of edges) tris.push([u, v, pi]);
          }

          tris = tris.filter(
            (tri) => tri[0] < base && tri[1] < base && tri[2] < base,
          );
          return { triangles: tris, points: pts };
        }

        // Effect 0: Full-screen random Delaunay triangle grid, 4-colored.
        // Space cycles the palette; click/tap re-grids the screen.
        effects.push({
          name: "Triangles",
          init() {
            this.triColor = new Map();
            this.anim = null;
            this.regrid(true);
          },
          onResize() {
            // The grid layout depends on the viewport, so snap instead of morph.
            this.regrid(true);
          },
          // A fresh jittered grid of corners.
          makePoints() {
            const points = [];
            // Overscan past every edge so the dark separators never form a
            // frame around the screen. The visible area stays fully covered.
            const m = Math.max(8 * DPR, Math.min(W, H) * 0.04);
            const x0 = -m,
              y0 = -m,
              x1 = W + m,
              y1 = H + m;
            points.push([x0, y0], [x1, y0], [x0, y1], [x1, y1]);
            const cell = Math.min(W, H) / (settings.reduceMotion ? 6 : 9);
            for (let x = x0 + cell / 2; x < x1; x += cell) {
              for (let y = y0 + cell / 2; y < y1; y += cell) {
                points.push([
                  x + rand(cell * 0.4, -cell * 0.4),
                  y + rand(cell * 0.4, -cell * 0.4),
                ]);
              }
            }
            return points;
          },
          regrid(snap) {
            const target = this.makePoints();
            if (snap || !this.points || this.points.length !== target.length) {
              // Init/resize: no matching corners to morph, so just snap.
              this.triColor = new Map();
              this.points = target;
              this.anim = null;
              this.triangulate();
              return;
            }
            // Morph every corner from where it is now to its new spot.
            this.from = this.points.map((p) => [p[0], p[1]]);
            this.target = target;
            this.t = 0;
            this.anim = true;
          },
          triangulate() {
            const { triangles } = delaunay(this.points);
            this.triangles = triangles;
            this.colorTriangles();
          },
          colorTriangles() {
            const tris = this.triangles;
            const n = tris.length;
            const adj = Array.from({ length: n }, () => new Set());
            const edgeMap = new Map();
            const ekey = (a, b) => (a < b ? a + "," + b : b + "," + a);
            tris.forEach((tri, i) => {
              for (let e = 0; e < 3; e++) {
                const k = ekey(tri[e], tri[(e + 1) % 3]);
                if (!edgeMap.has(k)) edgeMap.set(k, []);
                edgeMap.get(k).push(i);
              }
            });
            for (const list of edgeMap.values()) {
              for (let i = 0; i < list.length; i++) {
                for (let j = i + 1; j < list.length; j++) {
                  adj[list[i]].add(list[j]);
                  adj[list[j]].add(list[i]);
                }
              }
            }
            // Greedy 4-colouring seeded with the previous frame's colours,
            // keyed by the triangle's vertex triple. Triangles that survive
            // the morph keep their colour, so the grid doesn't flicker as it
            // flows to its new corners.
            const prev = this.triColor;
            const key = (t) => {
              let a = t[0],
                b = t[1],
                c = t[2];
              if (a > b) [a, b] = [b, a];
              if (b > c) [b, c] = [c, b];
              if (a > b) [a, b] = [b, a];
              return a + "," + b + "," + c;
            };
            const order = Array.from({ length: n }, (_, i) => i).sort(
              (a, b) => adj[b].size - adj[a].size,
            );
            const colors = new Array(n).fill(-1);
            for (const node of order) {
              const used = new Set();
              for (const nb of adj[node])
                if (colors[nb] >= 0) used.add(colors[nb]);
              let c = prev.get(key(tris[node]));
              if (c === undefined || used.has(c)) {
                c = 0;
                while (used.has(c)) c++;
              }
              colors[node] = c;
            }
            const map = new Map();
            tris.forEach((t, i) => map.set(key(t), colors[i]));
            this.triColor = map;
            this.colors = colors;
          },
          onSpace() {
            this.nextPalette();
            plink();
          },
          key() {
            // every key does something: either a fresh grid or new colours
            if (Math.random() < 0.5) this.regrid();
            else this.nextPalette();
            plink();
          },
          nextPalette() {
            settings.paletteIndex =
              (settings.paletteIndex + 1 + randi(palettes.length - 1)) %
              palettes.length;
          },
          onClick() {
            this.regrid();
            plink();
          },
          draw(dt) {
            // Morph corners towards their new spots, re-triangulating each
            // frame so the mesh stays a valid Delaunay as it flows.
            if (this.anim) {
              this.t = Math.min(1, this.t + dt / 0.5);
              const e = this.t * this.t * (3 - 2 * this.t);
              for (let i = 0; i < this.points.length; i++) {
                const a = this.from[i],
                  b = this.target[i];
                this.points[i][0] = a[0] + (b[0] - a[0]) * e;
                this.points[i][1] = a[1] + (b[1] - a[1]) * e;
              }
              this.triangulate();
              if (this.t >= 1) {
                this.anim = false;
                this.from = null;
                this.target = null;
              }
            }
            const cols = palette();
            clear("#0b0e11");
            ctx.lineJoin = "round";
            ctx.lineWidth = Math.max(1, Math.min(W, H) * 0.004);
            ctx.strokeStyle = "#0b0e11";
            for (let i = 0; i < this.triangles.length; i++) {
              const tri = this.triangles[i];
              const p0 = this.points[tri[0]];
              const p1 = this.points[tri[1]];
              const p2 = this.points[tri[2]];
              ctx.beginPath();
              ctx.moveTo(p0[0], p0[1]);
              ctx.lineTo(p1[0], p1[1]);
              ctx.lineTo(p2[0], p2[1]);
              ctx.closePath();
              ctx.fillStyle = cols[this.colors[i] % cols.length];
              ctx.fill();
              ctx.stroke();
            }
          },
        });

        // Effect 1: Paint - every key throws a splat of colour; taps paint too
        effects.push({
          name: "Paint",
          init() {
            this.splats = [];
          },
          splat(x, y) {
            // a huge range of colours across every hue
            const c = `hsl(${rand(360)}, ${rand(95, 62)}%, ${rand(68, 48)}%)`;
            const R = rand(Math.min(W, H) * 0.11, Math.min(W, H) * 0.04);
            const blobs = [];
            const n = randi(8, 4);
            for (let i = 0; i < n; i++) {
              const a = rand(Math.PI * 2);
              const d = rand(R * 1.5, 0);
              blobs.push({
                x: Math.cos(a) * d,
                y: Math.sin(a) * d,
                r: rand(R * 0.7, R * 0.22),
              });
            }
            this.splats.push({
              x,
              y,
              R,
              c,
              blobs,
              seed: rand(100),
              rot: rand(Math.PI * 2),
              born: 0,
            });
            const cap = settings.reduceMotion ? 34 : 70;
            if (this.splats.length > cap) this.splats.shift();
            noiseBurst({ dur: 0.12, vol: 0.2, from: 3200, to: 400 });
            tone({
              freq: rand(520, 260),
              slideTo: rand(200, 90),
              dur: 0.14,
              type: "triangle",
              vol: 0.16,
            });
          },
          key(e) {
            // holding a key keeps inflating the newest splat
            if (e && e.repeat && this.splats.length) this.growSplat();
            else this.splat(rand(W), rand(H));
          },
          growSplat() {
            const s = this.splats[this.splats.length - 1];
            const f = 1.09;
            s.R = Math.min(s.R * f, Math.min(W, H) * 0.55);
            for (const b of s.blobs) {
              b.x *= f;
              b.y *= f;
              b.r *= f;
            }
            const now = performance.now();
            if (now - (this.lastGrow || 0) > 70) {
              this.lastGrow = now;
              tone({ freq: rand(760, 440), dur: 0.05, vol: 0.05 });
            }
          },
          onClick(e) {
            const p = pointerPos(e);
            this.splat(p[0], p[1]);
          },
          draw(dt) {
            clear("#0e0e16");
            for (const s of this.splats) {
              s.born = Math.min(1, s.born + dt * 6);
              const grow = 0.55 + 0.45 * s.born;
              ctx.save();
              ctx.translate(s.x, s.y);
              ctx.rotate(s.rot);
              ctx.scale(grow, grow);
              // irregular main blob
              ctx.beginPath();
              const steps = 16;
              for (let i = 0; i <= steps; i++) {
                const a = (i / steps) * Math.PI * 2;
                const wob =
                  1 +
                  0.16 * Math.sin(a * 3 + s.seed) +
                  0.09 * Math.sin(a * 5 - s.seed * 1.7);
                const rr = s.R * wob;
                const px = Math.cos(a) * rr;
                const py = Math.sin(a) * rr;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
              }
              ctx.closePath();
              ctx.fillStyle = s.c;
              ctx.fill();
              // satellite droplets
              for (const b of s.blobs) {
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                ctx.fill();
              }
              // glossy highlight
              ctx.beginPath();
              ctx.arc(-s.R * 0.28, -s.R * 0.3, s.R * 0.22, 0, Math.PI * 2);
              ctx.fillStyle = "rgba(255,255,255,0.22)";
              ctx.fill();
              ctx.restore();
            }
          },
        });

        // Effect 2: Ripples - a wavy, interfering pond. Keys drop anywhere,
        // clicks drop exactly where you point.
        effects.push({
          name: "Ripples",
          cursor: "crosshair",
          init() {
            this.waves = [];
            this.rings = [];
            this.ambT = 0;
            this.buf = null;
            this.bufW = 0;
            this.bufH = 0;
          },
          ensureBuffer() {
            let gw = 120,
              gh = Math.round((120 * H) / W);
            if (gh > 120) {
              gh = 120;
              gw = Math.round((120 * W) / H);
            }
            gw = Math.max(24, gw);
            gh = Math.max(24, gh);
            if (this.buf && this.bufW === gw && this.bufH === gh) return;
            this.bufW = gw;
            this.bufH = gh;
            this.buf = document.createElement("canvas");
            this.buf.width = gw;
            this.buf.height = gh;
            this.bufCtx = this.buf.getContext("2d");
            this.img = this.bufCtx.createImageData(gw, gh);
          },
          addWave(x, y) {
            const lam = rand(130, 75) * DPR;
            const k = (Math.PI * 2) / lam;
            const spd = rand(280, 180) * DPR;
            this.waves.push({
              x,
              y,
              age: 0,
              k,
              w: k * spd,
              amp: rand(9, 5) * DPR,
              spread: rand(560, 320) * DPR,
              damp: rand(0.5, 0.32),
            });
            const cap = settings.reduceMotion ? 7 : 11;
            if (this.waves.length > cap) this.waves.shift();
          },
          ripple(x, y) {
            this.addWave(x, y);
            this.rings.push({ x, y, age: 0, dur: 0.45, r: rand(24, 14) * DPR });
            plop();
          },
          key() {
            this.ripple(rand(W), rand(H));
          },
          onClick(e) {
            const p = pointerPos(e);
            this.ripple(p[0], p[1]);
          },
          draw(dt) {
            this.ensureBuffer();
            this.ambT += dt;

            for (let i = this.waves.length - 1; i >= 0; i--) {
              const wv = this.waves[i];
              wv.age += dt;
              if (wv.age > 7) this.waves.splice(i, 1);
            }

            // Render the interference field into a small buffer, then upscale.
            const gw = this.bufW,
              gh = this.bufH;
            const data = this.img.data;
            const waves = this.waves;
            const ambT = this.ambT;
            // time decay is constant for a wave across the whole grid this frame
            for (let wi = 0; wi < waves.length; wi++)
              waves[wi]._decay = Math.exp(-waves[wi].damp * waves[wi].age);
            for (let gy = 0; gy < gh; gy++) {
              const wy = ((gy + 0.5) / gh) * H;
              for (let gx = 0; gx < gw; gx++) {
                const wx = ((gx + 0.5) / gw) * W;
                // gentle ambient swell so the whole surface always undulates
                let h =
                  3 * DPR * Math.sin(wx * 0.017 + wy * 0.011 + ambT * 1.1) +
                  2.4 * DPR * Math.sin(wx * 0.012 - wy * 0.019 - ambT * 0.8);
                for (let wi = 0; wi < waves.length; wi++) {
                  const wv = waves[wi];
                  const dx = wx - wv.x,
                    dy = wy - wv.y;
                  const d = Math.sqrt(dx * dx + dy * dy);
                  h +=
                    wv.amp *
                    Math.exp(-d / wv.spread) *
                    wv._decay *
                    Math.sin(wv.k * d - wv.w * wv.age);
                }
                const t = Math.max(0, Math.min(1, h / (16 * DPR) + 0.5));
                const idx = (gy * gw + gx) * 4;
                data[idx] = 4 + t * 120;
                data[idx + 1] = 30 + t * 200;
                data[idx + 2] = 48 + t * 205;
                data[idx + 3] = 255;
              }
            }
            this.bufCtx.putImageData(this.img, 0, 0);
            ctx.imageSmoothingEnabled = true;
            ctx.drawImage(this.buf, 0, 0, W, H);

            // impact flash rings
            for (let i = this.rings.length - 1; i >= 0; i--) {
              const r = this.rings[i];
              r.age += dt;
              const p = r.age / r.dur;
              if (p >= 1) {
                this.rings.splice(i, 1);
                continue;
              }
              ctx.globalAlpha = (1 - p) * 0.8;
              ctx.strokeStyle = "#e9fbff";
              ctx.lineWidth = Math.max(1, 3 * DPR * (1 - p));
              ctx.beginPath();
              ctx.arc(r.x, r.y, r.r * (1 + p * 2.4), 0, Math.PI * 2);
              ctx.stroke();
            }
            ctx.globalAlpha = 1;
          },
        });

        // Effect 3: Bouncy - persistent physics balls with goofy faces
        effects.push({
          name: "Bouncy",
          init() {
            this.balls = [];
            this.lastBoing = 0;
          },
          spawn(x, y) {
            const r = rand(Math.min(W, H) * 0.07, Math.min(W, H) * 0.028);
            const a = rand(Math.PI * 2);
            const sp = rand(300, 140) * DPR;
            this.balls.push({
              x: x == null ? rand(W - r, r) : x,
              y: y == null ? rand(H - r, r) : y,
              vx: Math.cos(a) * sp,
              vy: Math.sin(a) * sp,
              r,
              c: pick(palette()),
              squash: 1,
              blink: rand(3, 1.5),
              surprised: 0,
            });
            const cap = settings.reduceMotion ? 12 : 28;
            if (this.balls.length > cap) this.balls.shift();
            tone({
              freq: rand(620, 300),
              slideTo: rand(240, 120),
              dur: 0.18,
              type: "triangle",
              vol: 0.2,
            });
          },
          boing(r) {
            const now = performance.now();
            if (now - this.lastBoing < 45) return;
            this.lastBoing = now;
            tone({
              freq: Math.max(90, 700 - (r / DPR) * 1.4),
              slideTo: 80,
              dur: 0.14,
              type: "square",
              vol: 0.08,
            });
          },
          key() {
            this.spawn();
          },
          onClick(e) {
            const p = pointerPos(e);
            this.spawn(p[0], p[1]);
          },
          draw(dt) {
            clear("#0b0e11");
            const balls = this.balls;
            for (const b of balls) {
              b.x += b.vx * dt;
              b.y += b.vy * dt;
              b.blink -= dt;
              if (b.blink < -0.12) b.blink = rand(4, 1.5);
              if (b.surprised > 0) b.surprised -= dt;
              let hit = false;
              if (b.x - b.r < 0) {
                b.x = b.r;
                b.vx = Math.abs(b.vx);
                hit = true;
              }
              if (b.x + b.r > W) {
                b.x = W - b.r;
                b.vx = -Math.abs(b.vx);
                hit = true;
              }
              if (b.y - b.r < 0) {
                b.y = b.r;
                b.vy = Math.abs(b.vy);
                hit = true;
              }
              if (b.y + b.r > H) {
                b.y = H - b.r;
                b.vy = -Math.abs(b.vy);
                hit = true;
              }
              if (hit) {
                b.squash = 0.68;
                this.boing(b.r);
              }
              b.squash += (1 - b.squash) * Math.min(1, dt * 12);
            }
            // elastic ball-ball collisions
            for (let i = 0; i < balls.length; i++) {
              for (let j = i + 1; j < balls.length; j++) {
                const a = balls[i],
                  b = balls[j];
                let dx = b.x - a.x,
                  dy = b.y - a.y;
                let d = Math.hypot(dx, dy);
                if (d < 0.001) {
                  dx = 0.001;
                  dy = 0;
                  d = 0.001;
                }
                const min = a.r + b.r;
                if (d < min) {
                  const nx = dx / d,
                    ny = dy / d;
                  const push = (min - d) / 2;
                  a.x -= nx * push;
                  a.y -= ny * push;
                  b.x += nx * push;
                  b.y += ny * push;
                  const vn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
                  if (vn < 0) {
                    a.vx += vn * nx;
                    a.vy += vn * ny;
                    b.vx -= vn * nx;
                    b.vy -= vn * ny;
                    a.squash = b.squash = 0.72;
                    a.surprised = b.surprised = 0.14;
                    this.boing((a.r + b.r) / 2);
                  }
                }
              }
            }
            // keep any ball shoved by a collision inside the walls
            for (const b of balls) {
              b.x = Math.min(W - b.r, Math.max(b.r, b.x));
              b.y = Math.min(H - b.r, Math.max(b.r, b.y));
            }
            for (const b of balls) {
              const ang = Math.atan2(b.vy, b.vx);
              // squashed body, stretched along the direction of travel
              ctx.save();
              ctx.translate(b.x, b.y);
              ctx.rotate(ang);
              ctx.scale(1 + (1 - b.squash), b.squash);
              ctx.beginPath();
              ctx.arc(0, 0, b.r, 0, Math.PI * 2);
              ctx.fillStyle = b.c;
              ctx.fill();
              ctx.beginPath();
              ctx.arc(-b.r * 0.32, -b.r * 0.32, b.r * 0.26, 0, Math.PI * 2);
              ctx.fillStyle = "rgba(255,255,255,0.55)";
              ctx.fill();
              ctx.restore();
              // upright face
              const lx = Math.cos(ang) * b.r * 0.12;
              const ly = Math.sin(ang) * b.r * 0.12;
              const surprised = b.surprised > 0;
              const eyeR = Math.max(1.5, b.r * (surprised ? 0.18 : 0.13));
              ctx.fillStyle = "#20202a";
              for (const s of [-1, 1]) {
                if (b.blink < 0 && !surprised) {
                  ctx.fillRect(
                    b.x + s * b.r * 0.3 - eyeR,
                    b.y - b.r * 0.14,
                    eyeR * 2,
                    eyeR * 0.6,
                  );
                } else {
                  ctx.beginPath();
                  ctx.arc(
                    b.x + s * b.r * 0.3 + lx,
                    b.y - b.r * 0.14 + ly,
                    eyeR,
                    0,
                    Math.PI * 2,
                  );
                  ctx.fill();
                }
              }
              ctx.fillStyle = "#20202a";
              if (surprised) {
                // quick ":o" mouth on a collision
                ctx.beginPath();
                ctx.ellipse(
                  b.x + lx * 0.6,
                  b.y + b.r * 0.28,
                  b.r * 0.17,
                  b.r * 0.24,
                  0,
                  0,
                  Math.PI * 2,
                );
                ctx.fill();
              } else {
                ctx.strokeStyle = "#20202a";
                ctx.lineWidth = Math.max(1.5, b.r * 0.07);
                ctx.lineCap = "round";
                ctx.beginPath();
                ctx.arc(
                  b.x + lx * 0.6,
                  b.y + b.r * 0.06,
                  b.r * 0.4,
                  0.15 * Math.PI,
                  0.85 * Math.PI,
                );
                ctx.stroke();
              }
            }
          },
        });

        // Effect 4: Kaleidoscope - every key stamps a mirrored, rotating motif
        effects.push({
          name: "Kaleidoscope",
          init() {
            this.motifs = [];
            this.rot = 0;
            this.glow = 0;
          },
          key() {
            const shapes = [];
            const count = randi(6, 3);
            for (let i = 0; i < count; i++) {
              shapes.push({
                rad: rand(0.62, 0.1),
                ang: rand(Math.PI * 2),
                size: rand(0.07, 0.018),
                sides: randi(6, 3),
                spin: rand(1, -1),
              });
            }
            this.motifs.push({
              shapes,
              age: 0,
              dur: rand(6, 4),
              c: pick(palette()),
            });
            if (this.motifs.length > (settings.reduceMotion ? 8 : 16))
              this.motifs.shift();
            this.glow = 1;
            bell(randi(9, 0) + (Math.random() < 0.5 ? 0 : 5));
          },
          onClick() {
            this.key();
          },
          draw(dt) {
            const bg = ctx.createRadialGradient(
              W / 2,
              H / 2,
              0,
              W / 2,
              H / 2,
              Math.max(W, H) * 0.7,
            );
            bg.addColorStop(0, "#120a24");
            bg.addColorStop(1, "#05030c");
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, W, H);

            this.rot += dt * 0.08;
            this.glow += (0 - this.glow) * Math.min(1, dt * 2);

            const cx = W / 2,
              cy = H / 2;
            const R = Math.min(W, H);
            const folds = settings.reduceMotion ? 4 : 6;
            for (const m of this.motifs) {
              m.age += dt;
              const p = m.age / m.dur;
              if (p >= 1) continue;
              const alpha = Math.sin((1 - p) * Math.PI * 0.5) * 0.9;
              ctx.save();
              ctx.translate(cx, cy);
              ctx.rotate(this.rot + p * 0.3);
              for (let f = 0; f < folds; f++) {
                for (const mir of [1, -1]) {
                  ctx.save();
                  ctx.rotate((f / folds) * Math.PI * 2);
                  ctx.scale(mir, 1);
                  ctx.globalAlpha = alpha;
                  for (const s of m.shapes) {
                    const grow = 1 + p * 0.35;
                    const x = Math.cos(s.ang) * s.rad * R * grow;
                    const y = Math.sin(s.ang) * s.rad * R * grow;
                    const pulse = 1 + 0.18 * Math.sin(m.age * 4 + s.spin * 2);
                    drawPoly(
                      x,
                      y,
                      s.size * R * pulse,
                      s.sides,
                      s.spin * this.rot * 3,
                      m.c,
                    );
                  }
                  ctx.restore();
                }
              }
              ctx.restore();
            }
            // centre bloom
            ctx.globalAlpha = 0.5 + this.glow * 0.5;
            const cg = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 0.12);
            cg.addColorStop(0, "rgba(255,255,255,0.5)");
            cg.addColorStop(1, "rgba(255,255,255,0)");
            ctx.fillStyle = cg;
            ctx.beginPath();
            ctx.arc(cx, cy, R * 0.12, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
          },
        });

        // Rebuild size-dependent effects when the viewport changes (e.g. when
        // the page enters fullscreen) so they always fill the real screen.
        addEventListener("resize", () => {
          const e = effects[effectIdx];
          if (e && e._inited && e.onResize) e.onResize();
        });

        function setEffect(i) {
          effectIdx = ((i % effects.length) + effects.length) % effects.length;
          const e = effects[effectIdx];
          if (!e._inited) {
            e.init();
            e._inited = true;
          }
          canvas.style.cursor = e.cursor || "none";
          flashTabs();
        }

        // ---------- Engine Loop ----------
        let last = performance.now();
        function loop(now) {
          const dt =
            Math.min(0.05, (now - last) / 1000) *
            (settings.reduceMotion ? 0.6 : 1);
          last = now;
          t += dt;
          const e = effects[effectIdx];
          e.draw(dt);
          requestAnimationFrame(loop);
        }

        // ---------- Controls & Safety ----------
        // Tab bar showing every mode; the active one is highlighted.
        function buildTabs() {
          tabsEl.innerHTML = effects
            .map(
              (e, i) =>
                `<div class="tab"><span class="num">${i + 1}</span>${e.name}</div>`,
            )
            .join("");
        }
        function showTabs() {
          tabsEl.classList.remove("hidden");
          [...tabsEl.children].forEach((el, i) =>
            el.classList.toggle("active", i === effectIdx),
          );
        }
        let tabsTimer;
        function flashTabs(ms = 1600) {
          showTabs();
          clearTimeout(tabsTimer);
          tabsTimer = setTimeout(() => tabsEl.classList.add("hidden"), ms);
        }
        function toggleTabs() {
          if (tabsEl.classList.contains("hidden")) flashTabs(3000);
          else {
            clearTimeout(tabsTimer);
            tabsEl.classList.add("hidden");
          }
        }

        // Browsers only allow audio + fullscreen after a real gesture, so arm
        // all of that on the very first key or tap.
        let armed = false;
        let allowFullscreen = true;
        // When launched from the tools page we run inside a fullscreen iframe;
        // the parent owns fullscreen there, so we must not request it again.
        const embedded = (() => {
          try {
            return window.self !== window.top;
          } catch {
            return true;
          }
        })();
        function arm() {
          // Keep trying fullscreen until it sticks: browsers can reject an
          // early attempt, so this is deliberately not gated on `armed`.
          if (!embedded && allowFullscreen && !document.fullscreenElement) {
            enterFullscreen().then(() => {
              lockKeys();
              keepAwake();
            });
          }
          if (armed) return;
          armed = true;
          initAudio();
          if (AC && AC.state === "suspended") AC.resume().catch(() => {});
        }

        async function enterFullscreen() {
          const el = document.documentElement;
          try {
            if (el.requestFullscreen)
              await el.requestFullscreen({ navigationUI: "hide" });
            else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
          } catch {}
        }
        async function lockKeys() {
          if (navigator.keyboard && navigator.keyboard.lock) {
            try {
              // You cannot intercept OS shortcuts like Alt+Tab or volume. Esc may still leave FS.
              await navigator.keyboard.lock([
                "Escape",
                "F1",
                "F2",
                "F3",
                "F4",
                "F5",
                "F6",
                "F7",
                "F8",
                "F9",
                "F10",
                "F11",
                "F12",
                "Tab",
                "Alt",
              ]);
            } catch {}
          }
        }
        let wakeLock;
        async function keepAwake() {
          try {
            if ("wakeLock" in navigator)
              wakeLock = await navigator.wakeLock.request("screen");
          } catch {}
          document.addEventListener("visibilitychange", async () => {
            if (document.visibilityState === "visible" && wakeLock) {
              try {
                wakeLock = await navigator.wakeLock.request("screen");
              } catch {}
            }
          });
        }

        function preventDefaultKeys(e) {
          // Stop most browser-level interactions
          e.preventDefault();
          e.stopPropagation();
        }

        let pressedTime = 0; // for hold-to-exit with key 'E'

        addEventListener(
          "keydown",
          (e) => {
            // Prevent text focus navigation etc
            preventDefaultKeys(e);
            if (!started) return;
            if (e.key === "Escape") return; // handled by the exit listener
            arm();
            if (e.key === "?" || (e.code === "Slash" && e.shiftKey)) {
              toggleTabs();
              return;
            }
            if (e.code === "KeyE") {
              pressedTime = performance.now();
            }
            // Number keys select effects 1..n; any other key triggers current effect
            const num = parseInt(e.key, 10);
            if (!Number.isNaN(num)) {
              setEffect(num - 1);
              plink();
              return;
            }
            const cur = effects[effectIdx];
            if (e.code === "Space" && cur.onSpace) {
              cur.onSpace(e);
              return;
            }
            if (cur.key) cur.key(e);
            else plink();
          },
          true,
        );

        addEventListener(
          "keyup",
          (e) => {
            if (e.code === "KeyE" && pressedTime) {
              const held = performance.now() - pressedTime;
              pressedTime = 0;
              if (held > 1500) exit();
            }
          },
          true,
        );

        // Exit via Esc as a fallback
        addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            exit();
          }
        });

        // Exit via triple-click hotspot (top-left)
        let clicks = [];
        exitHotspot.addEventListener("click", () => {
          const now = performance.now();
          clicks = clicks.filter((t) => now - t < 600);
          clicks.push(now);
          if (clicks.length >= 3) exit();
        });

        function exit() {
          allowFullscreen = false;
          if (embedded) {
            // Let the launcher page drop its fullscreen iframe.
            try {
              window.parent.postMessage("babymode-exit", "*");
            } catch {}
          } else {
            document.exitFullscreen?.();
          }
          canvas.style.cursor = "default";
          flashTabs(2500);
        }

        // If the user leaves fullscreen by any route (Esc, F11, system UI),
        // stop trying to re-enter so the parent isn't trapped.
        document.addEventListener("fullscreenchange", () => {
          if (!document.fullscreenElement) allowFullscreen = false;
        });

        // Disable context menu / selection
        document.addEventListener("contextmenu", (e) => e.preventDefault());
        document.addEventListener("dragstart", (e) => e.preventDefault());
        document.addEventListener("selectstart", (e) => e.preventDefault());

        // Any first tap anywhere (including outside the canvas) arms
        // fullscreen + audio, so the very first touch goes fullscreen.
        addEventListener("pointerdown", arm);

        // Touch / click = effect-specific action (or KEY surrogate)
        canvas.addEventListener("pointerdown", (e) => {
          if (!started) return;
          arm();
          const cur = effects[effectIdx];
          if (cur.onClick) {
            cur.onClick(e);
          } else {
            cur.key?.(e);
            plink();
          }
        });

        // ---------- Go ----------
        let started = true;
        buildTabs();
        setEffect(0);
        requestAnimationFrame(loop);

        // Best effort: some browsers preserve activation across a same-origin
        // link navigation, so this can go fullscreen right away. If not, the
        // first key/tap arms it via arm().
        if (!embedded) enterFullscreen();

        // Palette cycling on Enter
        addEventListener(
          "keydown",
          (e) => {
            if (!started) return;
            if (e.code === "Enter") {
              settings.paletteIndex =
                (settings.paletteIndex + 1) % palettes.length;
              plink();
            }
            if (e.code === "Backspace") {
              const efx = effects[effectIdx];
              if (efx.init) {
                efx._inited = false;
                efx.init();
                efx._inited = true;
              }
            }
          },
          true,
        );
      })();
    </script>
  </body>
</html>
