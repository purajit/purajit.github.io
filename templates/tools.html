{% extends "base.html" %}
{% block content %}
<div class="flex-col gappy-2x">
{% for item in contents %}
<div class="contents-item"><a href="{{ item.link }}">{{ item.title }}</a></div>
{% endfor %}
</div>
{% endblock %}
{% block scripts %}
<script>
// Baby mode is a fullscreen experience. A browser only grants fullscreen from a
// real user gesture, and that gesture is the click on the link below - not the
// page load that follows it. So we open baby mode in an iframe and fullscreen
// the iframe while the click is still "fresh". If that fails, fall back to a
// normal navigation (where the first key/tap takes over).
(function () {
  var link = document.querySelector(
    'a[href="/tools/babymode"], a[href="/tools/babymode/"]'
  );
  if (!link) return;

  link.addEventListener("click", function (e) {
    // Let cmd/ctrl/shift/middle clicks open it normally in a new tab.
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0)
      return;
    e.preventDefault();
    var frame = document.createElement("iframe");
    frame.setAttribute("allow", "fullscreen; autoplay");
    frame.setAttribute("allowfullscreen", "");
    frame.src = "/tools/babymode/";
    frame.style.cssText =
      "position:fixed;inset:0;width:100%;height:100%;border:0;background:#000;z-index:9999";
    document.body.appendChild(frame);

    var done = false;
    function close() {
      if (done) return;
      done = true;
      window.removeEventListener("message", onMessage);
      document.removeEventListener("fullscreenchange", onFsChange);
      if (document.fullscreenElement) document.exitFullscreen().catch(function () {});
      frame.remove();
    }
    function onMessage(ev) {
      if (ev.data === "babymode-exit") close();
    }
    function onFsChange() {
      if (!document.fullscreenElement) close();
    }
    window.addEventListener("message", onMessage);
    document.addEventListener("fullscreenchange", onFsChange);
    frame.addEventListener("load", function () {
      frame.focus();
    });

    var req;
    try {
      req = frame.requestFullscreen
        ? frame.requestFullscreen()
        : Promise.reject();
    } catch (err) {
      req = Promise.reject(err);
    }
    Promise.resolve(req)
      .then(function () {
        frame.focus();
      })
      .catch(function () {
        // Fullscreen refused: get out of the way and navigate normally.
        close();
        window.location.href = "/tools/babymode/";
      });
  });
})();
</script>
{% endblock %}
